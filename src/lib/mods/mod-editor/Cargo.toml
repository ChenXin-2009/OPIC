[package]
name = "mod-editor"
version = "1.0.0"
edition = "2021"
description = "OPIC Mod 元数据编辑器 - 管理 MOD 图标和效果图"

[dependencies]
eframe = "0.31"
egui = "0.31"
image = { version = "0.25", features = ["png", "jpeg", "webp"] }
rfd = "0.15"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
