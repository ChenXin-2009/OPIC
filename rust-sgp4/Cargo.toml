[package]
name = "opic-sgp4"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
sgp4 = { version = "2.4", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
